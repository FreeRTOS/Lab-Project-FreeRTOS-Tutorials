51) Message Buffer for Variable-Length Frames  
Q – In a wireless sensor node, you receive UBX-formatted GPS frames (variable length up to 256 bytes) in an ISR and must forward complete frames to a task. Which primitive?  
A – **Message Buffer** (supports variable lengths).  
```c
// Create a message buffer with room for one 256-byte message + 4‐byte length field
MessageBufferHandle_t mb = xMessageBufferCreate(260);
// ISR
void UART_RX_IRQHandler() {
    static uint8_t buf[260];
    static size_t idx=0;
    uint8_t b = READ_REG(UART_DR);
    buf[idx++] = b;
    if (isEndOfFrame(buf,idx)) {
        size_t sent = xMessageBufferSendFromISR(mb, buf, idx, NULL);
        idx = 0;
    }
}
// Task
void vGpsTask(void *pv) {
    uint8_t rxbuf[260];
    for (;;) {
        size_t len = xMessageBufferReceive(mb, rxbuf, sizeof(rxbuf), portMAX_DELAY);
        parseUblox(rxbuf, len);
    }
}
```

52) DMA + Task Notification for Bulk Transfers  
Q – A camera module writes frames to memory via DMA. You need a task to process each complete frame ASAP. How sync?  
A – Use **task notifications from ISR** in the DMA completion callback.  
```c
// DMA complete ISR
void DMA_IRQHandler() {
    BaseType_t xHigher = pdFALSE;
    vTaskNotifyGiveFromISR(frameTaskHandle, &xHigher);
    portYIELD_FROM_ISR(xHigher);
}
// Task
void vFrameTask(void *pv) {
    for (;;) {
        ulTaskNotifyTake(pdTRUE, portMAX_DELAY);
        processImage(frameBuffer);
    }
}
```

53) Power-Management Hook for Tickless Idle  
Q – In a USB gamepad, you want max battery life during idle. Which hook and config?  
A – Enable `configUSE_TICKLESS_IDLE`, implement `vPortSuppressTicksAndSleep()` to call `__WFI()`.  
```c
// FreeRTOSConfig.h
#define configUSE_TICKLESS_IDLE 1
// port.c
void vPortSuppressTicksAndSleep(TickType_t xExpectedIdleTime) {
    stopSysTick();
    HAL_PWR_EnterSleepMode(PWR_MAINREGULATOR_ON, PWR_SLEEPENTRY_WFI);
    startSysTick();
}
```

54) Stream Buffer vs Event Group for State Flags  
Q – A toothbrush has 3 LEDs (OK, Error, LowBat). You need a task to set/clear LEDs based on flags set from ISRs. Which primitive?  
A – **Event Group** (flags).  
```c
EventGroupHandle_t leds = xEventGroupCreate();
#define LED_OK    (1<<0)
#define LED_ERR   (1<<1)
#define LED_LOW   (1<<2)
// ISR sets bits:
xEventGroupSetBitsFromISR(leds, LED_LOW, NULL);
// Task reads flags:
void vLedTask(void *pv) {
  for (;;) {
    EventBits_t bits = xEventGroupWaitBits(leds, LED_OK|LED_ERR|LED_LOW,
                                           pdTRUE, pdFALSE, portMAX_DELAY);
    setOk((bits&LED_OK)!=0);
    setErr((bits&LED_ERR)!=0);
    setLow((bits&LED_LOW)!=0);
  }
}
```

55) Chained Software Timers for Retries  
Q – A BLE pairing module must retry every 5 s up to 3 times, then give up. How to implement?  
A – **One-shot software timer** + counter in its callback.  
```c
static TimerHandle_t retryTimer;
static int retryCount;
void vRetryCB(TimerHandle_t x) {
    if (retryCount++ < 3) {
        startBlePairing();
        xTimerStart(retryTimer, 0);
    } else {
        notifyUserFailure();
    }
}
void initRetry(void) {
    retryCount = 0;
    retryTimer = xTimerCreate("RTRY", pdMS_TO_TICKS(5000), pdFALSE, NULL, vRetryCB);
    xTimerStart(retryTimer, 0);
}
```

56) Aborting a Long Delay  
Q – In a pulse-ox device, sampling task may wait up to 100 ms between samples. If user presses Stop, you must wake it immediately. Which API?  
A – `xTaskAbortDelay()` on its handle.  
```c
// Sampling task
void vSample(void *pv) {
  for (;;) {
    if (xTaskNotifyWait(0,0,NULL,pdMS_TO_TICKS(100))) break;
    readSensor();
  }
}
// Stop button ISR
void BTN_IRQHandler() {
  xTaskAbortDelay(sampleTaskHandle);
}
```

57) Cooperative Region Within Preemptive System  
Q – Game controller: sensor and UI tasks share an I²C bus. Bus-holding time is short, but you want to avoid preemption during a multi-byte transaction. How to enforce cooperative section?  
