xSemaphoreTake(crcMutex,portMAX_DELAY);
crc = calcCrc(data,len);
xSemaphoreGive(crcMutex);
- Custom Assertion Hook
Q – How to capture file/line when an assertion fails in FreeRTOS?
A – Override configASSERT() macro to log __FILE__ and __LINE__ then halt.
- Multi-Core FreeRTOS
Q – On a dual-core MCU, how do you pin tasks to cores?
A – Use FreeRTOS SMP variant or two separate schedulers; assign affinity via vTaskCoreAffinity().
- Porting FreeRTOS to New MCU
Q – What files must you implement to port FreeRTOS to a new CPU?
A –
• port.c – context save/restore, tick handler
• portmacro.h – critical section, types
• Optionally portISR.c – IRQ wrappers
• heap_x.c – choose allocator
