59) Passing Large Objects by Reference vs Copy  
Q – A vision-AI task needs a 1 KB ROI descriptor from capture task. Should you queue the struct or a pointer? Why?  
A – Queue the pointer (zero-copy). Buffer lifetime managed by capture task.  
```c
static Descriptor descriptors[4];
static int idx=0;
QueueHandle_t xDescQ = xQueueCreate(4,sizeof(Descriptor*));
void vCapture(void *pv) {
  for (;;) {
    processFrame(&descriptors[idx]);
    Descriptor *p=&descriptors[idx++];
    if (idx==4) idx=0;
    xQueueSend(xDescQ, &p, portMAX_DELAY);
  }
}
void vAnalyze(void *pv) {
  Descriptor *p;
  for (;;) {
    xQueueReceive(xDescQ, &p, portMAX_DELAY);
    analyze(p);
  }
}
```

60) Asymmetric MP on Dual-Core MCU  
Q – Your SoC has two cores. Core-A runs network stack, Core-B runs control loop. You need to notify Core-B when a message arrives on Core-A. How?  
A – Use **FreeRTOS + IPC queue** in shared SRAM with spinlock or hardware semaphore.  
```c
// Core-A
void vNetTask(void*pv) {
  for(;;){
    msg = receiveNet();
    while(!HW_SEM_Take());    // hardware semaphore
    SharedQueue[tail++] = msg;
    HW_SEM_Give();
    vTaskNotifyGiveFromISR(coreBTask, NULL);
  }
}
// Core-B
void vCtrlTask(void*pv) {
  for(;;){
    ulTaskNotifyTake(pdTRUE, portMAX_DELAY);
    while(!HW_SEM_Take());
      msg = SharedQueue[head++];
    HW_SEM_Give();
    processCtrl(msg);
  }
}
```

